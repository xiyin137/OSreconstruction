name = "OSReconstruction"
version = "0.1.0"
defaultTargets = ["OSReconstruction"]

[[require]]
name = "GaussianField"
git = "https://github.com/mrdouglasny/gaussian-field.git"
rev = "e28a381288f0c6cdd275f9fd84cfb1b20feea957"
subDir = "."

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "OSReconstruction"

# Separate entry points for the trusted statement and its implementation proof.
# They are deliberately excluded from defaultTargets: Challenge contains the
# comparator's theorem placeholders and must never enter the production library.
[[lean_lib]]
name = "ComparatorAudit"
srcDir = "verification/comparator"
roots = ["Definitions", "Challenge", "Solution", "WightmanBridge", "OSBridge", "ReverseBridge"]
